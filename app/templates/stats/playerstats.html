{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/playertable.css') }}">
{% endblock %}

{% block content %}
<header class="dash-head">
    <h1 class="dash-title">Player statistics</h1>
    <p class="dash-sub">Game performance across the playgroup</p>
</header>

<section class="panel">
    <!-- Controls: year segmented control + min-games filter -->
    <div class="ptable-controls">
        <div class="seg" id="year-filter-buttons" role="group" aria-label="Filter by year">
            <button type="button" class="seg__btn active" data-year="all">Overall</button>
        </div>
        <div class="ptable-controls__spacer"></div>
        <label class="ptable-controls__min" for="min-games-filter">Min games</label>
        <input type="number" id="min-games-filter" min="0" placeholder="0" inputmode="numeric">
        <button type="button" id="apply-games-filter" class="btn btn--ghost">Apply</button>
        <button type="button" id="reset-games-filter" class="btn btn--ghost">Reset</button>
    </div>

    <div class="ptable-wrap">
        <table id="player-stats-table" class="ptable">
            <thead>
                <tr>
                    <th data-type="string" data-key="name">Player</th>
                    <th data-type="number" data-key="games">Games</th>
                    <th data-type="number" data-key="wins">Wins</th>
                    <th data-type="number" data-key="winrate_pct">Winrate %</th>
                    <th data-type="number" data-key="first">First</th>
                    <th data-type="number" data-key="first_pct">First %</th>
                    <th data-type="number" data-key="early_sol_ring">Fast Mana</th>
                    <th data-type="number" data-key="sol_ring_pct">Fast Mana %</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</section>

<script>
    let originalPlayerData = [];
    // Default order: most games played (descending). idx 1 = Games column.
    let currentSort = { idx: 1, asc: false, type: 'number' };
    let activeYear = 'all';

    function encode(value) { return encodeURIComponent(value); }

    document.addEventListener('DOMContentLoaded', function () {
        const yearContainer = document.getElementById('year-filter-buttons');

        function loadData(url) {
            return fetch(url)
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(data => { originalPlayerData = data; renderTable(); })
                .catch(err => {
                    console.error('Failed to load player data:', err);
                    const tbody = document.querySelector('#player-stats-table tbody');
                    if (tbody) {
                        const cols = document.querySelectorAll('#player-stats-table thead th').length;
                        tbody.innerHTML = `<tr><td colspan="${cols}" class="ptable__empty">Daten konnten nicht geladen werden.</td></tr>`;
                    }
                });
        }

        // Year filter buttons.
        fetch('/api/data/years')
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(years => {
                years.forEach(year => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'seg__btn';
                    btn.setAttribute('data-year', year);
                    btn.textContent = year;
                    yearContainer.appendChild(btn);
                });
                attachYearListeners();
            })
            .catch(err => console.error('Failed to load years:', err));

        loadData('/api/data');

        function attachYearListeners() {
            yearContainer.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', function () {
                    const year = this.getAttribute('data-year');
                    yearContainer.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    activeYear = year;
                    loadData(year === 'all' ? '/api/data' : `/api/data/${year}`);
                });
            });
        }

        document.getElementById('apply-games-filter').addEventListener('click', renderTable);
        document.getElementById('reset-games-filter').addEventListener('click', () => {
            document.getElementById('min-games-filter').value = '';
            currentSort = { idx: 1, asc: false, type: 'number' };
            renderTable();
        });

        function renderTable() {
            const minGames = parseInt(document.getElementById('min-games-filter').value, 10) || 0;
            let rows = originalPlayerData.filter(item => (item.games || 0) >= minGames);

            if (currentSort.idx !== null) {
                const headers = document.querySelectorAll('#player-stats-table thead th');
                const key = headers[currentSort.idx].getAttribute('data-key');
                rows.sort((a, b) => {
                    let valA = a[key], valB = b[key];
                    if (currentSort.type === 'number') {
                        return currentSort.asc ? (valA - valB) : (valB - valA);
                    }
                    return currentSort.asc
                        ? String(valA).localeCompare(String(valB))
                        : String(valB).localeCompare(String(valA));
                });
            }
            updateSortIndicators();
            populate(rows);
        }

        function updateSortIndicators() {
            document.querySelectorAll('#player-stats-table th').forEach((th, idx) => {
                th.classList.remove('sorted-asc', 'sorted-desc');
                if (idx === currentSort.idx) th.classList.add(currentSort.asc ? 'sorted-asc' : 'sorted-desc');
            });
        }

        function populate(data) {
            const tbody = document.querySelector('#player-stats-table tbody');
            const headers = document.querySelectorAll('#player-stats-table thead th');
            tbody.innerHTML = '';
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = Array.from(headers).map(h => {
                    const key = h.getAttribute('data-key');
                    if (key === 'name') {
                        const n = item[key] || '';
                        return `<td><a href="/player/${encode(n)}" class="player-link">${n}</a></td>`;
                    }
                    const v = item[key];
                    return `<td>${v !== null && v !== undefined ? v : ''}</td>`;
                }).join('');
                tbody.appendChild(row);
            });
        }

        document.querySelectorAll('#player-stats-table th').forEach((th, idx) => {
            th.addEventListener('click', function () {
                const type = th.getAttribute('data-type');
                if (currentSort.idx === idx) {
                    currentSort.asc = !currentSort.asc;
                } else {
                    // New column: numbers default to descending, text to ascending.
                    currentSort = { idx, asc: type !== 'number', type };
                }
                renderTable();
            });
        });
    });
</script>
{% endblock %}
